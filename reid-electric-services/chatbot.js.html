<!--
  Reid Electric Services, LLC — Website Chat Widget
  ---------------------------------------------------
  Self-contained, dependency-free chat widget component.
  Drop this file's contents directly into the host page's HTML
  (anywhere inside <body>, ideally just before </body>).

  No external requests are made on load. No tracking/analytics.
  No auto-open — the widget only opens on user click.

  CONFIGURATION — the only two things you need to edit before going live:
    1. LEAD_FORM_ENDPOINT  (search for it below, near the top of the <script>)
       Set to a real Formspree endpoint URL, e.g.
       "https://formspree.io/f/abcd1234"
    2. FALLBACK_EMAIL      (right below LEAD_FORM_ENDPOINT)
       Set to the real inbox that should receive leads via the
       mailto: fallback, e.g. "leads@reidelectricservices.com"

  Until LEAD_FORM_ENDPOINT is changed from the placeholder value,
  the widget automatically falls back to a working mailto: link so
  leads are never silently lost.
-->

<style>
  /* =====================================================
     Reid Electric Services — Chat Widget Styles
     All rules are scoped under .re-chat-* to avoid colliding
     with the host page's CSS. No global element selectors.
     ===================================================== */

  .re-chat-widget,
  .re-chat-widget *,
  .re-chat-widget *::before,
  .re-chat-widget *::after {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
  }

  .re-chat-widget {
    --re-black: #141414;
    --re-charcoal: #1e1e1e;
    --re-charcoal-2: #2a2a2a;
    --re-charcoal-3: #383838;
    --re-red: #d62828;
    --re-red-dark: #a81f1f;
    --re-white: #ffffff;
    --re-gray-light: #f4f4f4;
    --re-gray-mid: #b9b9b9;
    --re-gray-text: #555555;
    --re-radius: 14px;
    /* how far the bubble sits off the bottom edge on wide viewports */
    --re-bubble-bottom: 24px;
    line-height: 1.4;
  }

  /* ---------- Floating toggle bubble ---------- */

  .re-chat-toggle {
    position: fixed;
    right: 24px;
    bottom: var(--re-bubble-bottom);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--re-black);
    border: 2px solid var(--re-red);
    color: var(--re-red);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    z-index: 2147483000;
    padding: 0;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .re-chat-toggle:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4);
  }

  .re-chat-toggle:focus-visible {
    outline: 3px solid var(--re-red);
    outline-offset: 3px;
  }

  .re-chat-toggle svg {
    width: 28px;
    height: 28px;
    display: block;
  }

  /* Swap icon (speech bubble <-> close X) based on open state */
  .re-chat-toggle .re-chat-icon-close {
    display: none;
  }
  .re-chat-toggle[aria-expanded="true"] .re-chat-icon-chat {
    display: none;
  }
  .re-chat-toggle[aria-expanded="true"] .re-chat-icon-close {
    display: block;
  }

  /* Small "unread"-style dot to draw the eye without being pushy (no motion/timer) */
  .re-chat-toggle-dot {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--re-red);
    border: 2px solid var(--re-black);
  }
  .re-chat-toggle[aria-expanded="true"] .re-chat-toggle-dot {
    display: none;
  }

  /* ---------- Chat panel ---------- */

  .re-chat-panel {
    display: none;
    flex-direction: column;
    position: fixed;
    right: 24px;
    bottom: calc(var(--re-bubble-bottom) + 60px + 14px);
    width: 360px;
    max-width: calc(100vw - 32px);
    height: 520px;
    max-height: calc(100vh - var(--re-bubble-bottom) - 60px - 34px);
    background: var(--re-white);
    border-radius: var(--re-radius);
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    z-index: 2147483000;
    border: 1px solid var(--re-charcoal-3);
  }

  .re-chat-panel.re-chat-panel--open {
    display: flex;
  }

  /* ---------- Header ---------- */

  .re-chat-header {
    background: var(--re-black);
    color: var(--re-white);
    padding: 14px 16px 10px;
    flex-shrink: 0;
    border-bottom: 3px solid var(--re-red);
  }

  .re-chat-header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  .re-chat-title {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  .re-chat-title span {
    color: var(--re-red);
  }

  .re-chat-close {
    background: transparent;
    border: none;
    color: var(--re-gray-mid);
    cursor: pointer;
    padding: 2px;
    line-height: 0;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .re-chat-close:hover {
    color: var(--re-white);
  }
  .re-chat-close:focus-visible {
    outline: 2px solid var(--re-red);
    outline-offset: 2px;
  }
  .re-chat-close svg {
    width: 18px;
    height: 18px;
    display: block;
  }

  .re-chat-disclaimer {
    margin: 6px 0 0;
    font-size: 11px;
    color: var(--re-gray-mid);
  }

  /* ---------- Persistent call/text bar (escape hatch, always visible) ---------- */

  .re-chat-callbar {
    flex-shrink: 0;
    background: var(--re-charcoal-2);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .re-chat-callbar-label {
    font-size: 11px;
    color: var(--re-gray-mid);
  }

  .re-chat-call-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--re-red);
    color: var(--re-white);
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .re-chat-call-link:hover {
    background: var(--re-red-dark);
  }
  .re-chat-call-link:focus-visible {
    outline: 2px solid var(--re-white);
    outline-offset: 2px;
  }
  .re-chat-call-link svg {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
  }

  .re-chat-call-link--alt {
    background: transparent;
    border: 1px solid var(--re-gray-mid);
    color: var(--re-gray-mid);
    font-weight: 600;
  }
  .re-chat-call-link--alt:hover {
    color: var(--re-white);
    border-color: var(--re-white);
  }

  /* ---------- Message stream ---------- */

  .re-chat-messages {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 14px 6px;
    background: var(--re-gray-light);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .re-chat-msg {
    max-width: 86%;
    padding: 9px 12px;
    border-radius: 12px;
    font-size: 13.5px;
    color: var(--re-black);
    white-space: pre-line;
  }

  .re-chat-msg--bot {
    background: var(--re-white);
    border: 1px solid #e2e2e2;
    align-self: flex-start;
    border-bottom-left-radius: 3px;
  }

  .re-chat-msg--user {
    background: var(--re-black);
    color: var(--re-white);
    align-self: flex-end;
    border-bottom-right-radius: 3px;
  }

  /* Emergency alert block */
  .re-chat-alert {
    align-self: stretch;
    background: #fdecec;
    border: 1.5px solid var(--re-red);
    border-radius: 12px;
    padding: 12px;
  }
  .re-chat-alert-title {
    margin: 0 0 6px;
    font-size: 13.5px;
    font-weight: 800;
    color: var(--re-red-dark);
  }
  .re-chat-alert-text {
    margin: 0 0 10px;
    font-size: 13px;
    color: var(--re-black);
  }
  .re-chat-alert-calls {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .re-chat-alert-call {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--re-red);
    color: var(--re-white);
    text-decoration: none;
    font-weight: 800;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .re-chat-alert-call:hover {
    background: var(--re-red-dark);
  }
  .re-chat-alert-call:focus-visible {
    outline: 2px solid var(--re-black);
    outline-offset: 2px;
  }
  .re-chat-alert-call svg {
    width: 15px;
    height: 15px;
  }

  /* ---------- Quick reply buttons ---------- */

  .re-chat-quickreplies {
    align-self: stretch;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .re-chat-quick {
    background: var(--re-white);
    border: 1.5px solid var(--re-black);
    color: var(--re-black);
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .re-chat-quick:hover {
    background: var(--re-black);
    color: var(--re-white);
  }
  .re-chat-quick:focus-visible {
    outline: 2px solid var(--re-red);
    outline-offset: 2px;
  }
  .re-chat-quick:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .re-chat-quick--urgent {
    border-color: var(--re-red);
    color: var(--re-red-dark);
  }
  .re-chat-quick--urgent:hover {
    background: var(--re-red);
    color: var(--re-white);
  }

  /* ---------- Lead capture form ---------- */

  .re-chat-lead {
    align-self: stretch;
    background: var(--re-white);
    border: 1px solid #e2e2e2;
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .re-chat-lead-intro {
    margin: 0 0 2px;
    font-size: 13px;
    color: var(--re-black);
  }

  .re-chat-field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .re-chat-field label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--re-gray-text);
  }

  .re-chat-field input,
  .re-chat-field textarea {
    border: 1.5px solid #d8d8d8;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13.5px;
    color: var(--re-black);
    background: var(--re-white);
    resize: vertical;
    width: 100%;
  }

  .re-chat-field input:focus,
  .re-chat-field textarea:focus {
    outline: none;
    border-color: var(--re-red);
  }

  .re-chat-lead-submit {
    margin-top: 4px;
    background: var(--re-red);
    color: var(--re-white);
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13.5px;
    padding: 10px 12px;
    cursor: pointer;
  }
  .re-chat-lead-submit:hover {
    background: var(--re-red-dark);
  }
  .re-chat-lead-submit:focus-visible {
    outline: 2px solid var(--re-black);
    outline-offset: 2px;
  }
  .re-chat-lead-submit:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .re-chat-lead-note {
    margin: 0;
    font-size: 10.5px;
    color: var(--re-gray-text);
  }

  .re-chat-restart {
    align-self: flex-start;
    background: transparent;
    border: none;
    color: var(--re-gray-text);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    padding: 2px 0;
  }
  .re-chat-restart:hover {
    color: var(--re-black);
  }

  /* ---------- Mobile responsiveness ---------- */
  /* Assume the host page may have a fixed bottom bar (~60px tall) on
     narrow viewports (e.g. a sticky "Call Now" bar). Keep the bubble
     and panel comfortably clear of it. */

  @media (max-width: 480px) {
    .re-chat-widget {
      --re-bubble-bottom: 80px;
    }

    .re-chat-toggle {
      right: 16px;
      width: 56px;
      height: 56px;
    }

    .re-chat-panel {
      right: 16px;
      left: 16px;
      width: auto;
      max-width: none;
      height: auto;
      bottom: calc(var(--re-bubble-bottom) + 56px + 12px);
      max-height: calc(100vh - var(--re-bubble-bottom) - 56px - 32px);
    }

    .re-chat-callbar {
      justify-content: center;
      text-align: center;
    }
  }

  /* Respect users who prefer reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .re-chat-toggle {
      transition: none;
    }
  }
</style>

<!-- =====================================================
     Markup
     ===================================================== -->
<div class="re-chat-widget" id="reChatWidget">
  <button
    type="button"
    class="re-chat-toggle"
    id="reChatToggle"
    aria-label="Open chat with Reid Electric Services"
    aria-expanded="false"
    aria-controls="reChatPanel"
  >
    <span class="re-chat-toggle-dot" aria-hidden="true"></span>
    <!-- Hand-drawn outline speech-bubble icon (open state) -->
    <svg
      class="re-chat-icon-chat"
      viewBox="0 0 32 32"
      fill="none"
      aria-hidden="true"
    >
      <path
        d="M6 8.5C6 6.6 7.6 5 9.5 5h13C24.4 5 26 6.6 26 8.5v9c0 1.9-1.6 3.5-3.5 3.5H14l-5.5 5v-5H9.5C7.6 20 6 18.4 6 16.5v-8z"
        stroke="currentColor"
        stroke-width="2"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
      <circle cx="12" cy="12.5" r="1.3" fill="currentColor" />
      <circle cx="16.3" cy="12.5" r="1.3" fill="currentColor" />
      <circle cx="20.6" cy="12.5" r="1.3" fill="currentColor" />
    </svg>
    <!-- Close (X) icon (open state) -->
    <svg
      class="re-chat-icon-close"
      viewBox="0 0 32 32"
      fill="none"
      aria-hidden="true"
    >
      <path
        d="M9 9l14 14M23 9L9 23"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
      />
    </svg>
  </button>

  <div
    class="re-chat-panel"
    id="reChatPanel"
    role="dialog"
    aria-modal="false"
    aria-label="Chat with Reid Electric Services"
    aria-hidden="true"
  >
    <div class="re-chat-header">
      <div class="re-chat-header-top">
        <p class="re-chat-title">
          Reid Electric Services, <span>LLC</span>
        </p>
        <button
          type="button"
          class="re-chat-close"
          id="reChatCloseBtn"
          aria-label="Close chat"
        >
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path
              d="M9 9l14 14M23 9L9 23"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>
      <p class="re-chat-disclaimer">
        You're chatting with our website assistant, not a live person.
      </p>
    </div>

    <div class="re-chat-callbar">
      <span class="re-chat-callbar-label">Prefer to talk now?</span>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <a class="re-chat-call-link" href="tel:+12059035792">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M4 4.5c0-.8.6-1.4 1.4-1.4h2.4c.7 0 1.2.4 1.4 1l1 3c.2.5 0 1.1-.4 1.5L8.4 10a12 12 0 0 0 5.6 5.6l1.4-1.4c.4-.4 1-.5 1.5-.4l3 1c.6.2 1 .7 1 1.4v2.4c0 .8-.6 1.4-1.4 1.4C11.9 20 4 12.1 4 4.5z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
          </svg>
          Call/Text (205) 903-5792
        </a>
        <a
          class="re-chat-call-link re-chat-call-link--alt"
          href="tel:+12053680374"
        >
          (205) 368-0374
        </a>
      </div>
    </div>

    <div
      class="re-chat-messages"
      id="reChatMessages"
      aria-live="polite"
    ></div>
  </div>
</div>

<!-- =====================================================
     Behavior
     ===================================================== -->
<script>
  (function () {
    "use strict";

    /* =====================================================
       CONFIGURATION — edit these two constants to go live.
       ===================================================== */

    // 1) Set this to a real Formspree (or similar) form endpoint URL.
    //    Example: "https://formspree.io/f/abcd1234"
    //    While this equals the placeholder below, the widget uses a
    //    mailto: fallback instead of posting anywhere.
    var LEAD_FORM_ENDPOINT = "REPLACE_WITH_FORMSPREE_ENDPOINT";

    // 2) Set this to the inbox that should receive leads via the
    //    mailto: fallback (used only while LEAD_FORM_ENDPOINT is
    //    still the placeholder above).
    var FALLBACK_EMAIL = "REPLACE_WITH_EMAIL";

    /* ===================================================== */

    var PLACEHOLDER_ENDPOINT = "REPLACE_WITH_FORMSPREE_ENDPOINT";
    var PRIMARY_PHONE_DISPLAY = "(205) 903-5792";
    var PRIMARY_PHONE_TEL = "+12059035792";
    var SECONDARY_PHONE_DISPLAY = "(205) 368-0374";
    var SECONDARY_PHONE_TEL = "+12053680374";

    var TOPICS = {
      panel: {
        label: "Panel Upgrade",
        response:
          "Common signs you may need a panel upgrade: breakers that trip often, a fuse box instead of breakers, flickering lights, or you're adding an EV charger, generator, or major appliance. We can take a look and tell you straight what it needs.",
      },
      rewiring: {
        label: "Rewiring",
        response:
          "If your home has knob-and-tube or aluminum wiring, warm outlets, or frequent flickering, that's usually worth a look. A licensed electrician should inspect before you commit to a full rewire, since scope varies a lot house to house.",
      },
      ev: {
        label: "EV Charger",
        response:
          "Most Level 2 home EV chargers need a dedicated 240V circuit sized to your vehicle and your panel's available capacity. We handle the permitting and installation end to end.",
      },
      generator: {
        label: "Generator",
        response:
          "Standby generators require a transfer switch installed by a licensed electrician, so power never backfeeds into utility lines during an outage. That's a safety code requirement, not optional.",
      },
      lighting: {
        label: "Lighting/Cameras",
        response:
          "We install indoor and outdoor lighting, motion-sensor fixtures, and wired security camera systems. Happy to talk through what you're trying to cover and what's realistic for your setup.",
      },
      other: {
        label: "Something Else",
        response:
          "No problem — tell us a bit about what's going on below and we'll follow up.",
      },
      emergency: {
        label: "This Is an Emergency",
        response: null, // handled separately, see renderEmergency()
      },
    };

    var QUICK_REPLY_ORDER = [
      "panel",
      "rewiring",
      "ev",
      "generator",
      "lighting",
      "other",
      "emergency",
    ];

    /* ---------- DOM refs ---------- */

    var toggleBtn = document.getElementById("reChatToggle");
    var closeBtn = document.getElementById("reChatCloseBtn");
    var panel = document.getElementById("reChatPanel");
    var messagesEl = document.getElementById("reChatMessages");

    var lastFocusedEl = null;

    /* ---------- Small DOM helpers ---------- */

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    }

    function scrollMessagesToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addBotMessage(text) {
      var msg = el("div", "re-chat-msg re-chat-msg--bot", text);
      messagesEl.appendChild(msg);
      scrollMessagesToBottom();
      return msg;
    }

    function addUserMessage(text) {
      var msg = el("div", "re-chat-msg re-chat-msg--user", text);
      messagesEl.appendChild(msg);
      scrollMessagesToBottom();
      return msg;
    }

    /* ---------- Conversation flow ---------- */

    function startConversation() {
      messagesEl.innerHTML = "";
      addBotMessage(
        "Need help with an electrical project? What's this about?"
      );
      renderQuickReplies();
    }

    function renderQuickReplies() {
      var group = el("div", "re-chat-quickreplies");
      QUICK_REPLY_ORDER.forEach(function (key) {
        var topic = TOPICS[key];
        var btn = el("button", "re-chat-quick", topic.label);
        btn.type = "button";
        if (key === "emergency") {
          btn.className += " re-chat-quick--urgent";
        }
        btn.addEventListener("click", function () {
          handleTopicSelection(key, group);
        });
        group.appendChild(btn);
      });
      messagesEl.appendChild(group);
      scrollMessagesToBottom();
    }

    function handleTopicSelection(key, quickReplyGroup) {
      var topic = TOPICS[key];

      // Lock the quick replies so they can't be clicked twice.
      var buttons = quickReplyGroup.querySelectorAll(".re-chat-quick");
      buttons.forEach(function (b) {
        b.disabled = true;
      });

      addUserMessage(topic.label);

      if (key === "emergency") {
        renderEmergency();
      } else {
        addBotMessage(topic.response);
      }

      renderLeadPrompt(key);
    }

    function renderEmergency() {
      var alertBox = el("div", "re-chat-alert");

      var title = el(
        "p",
        "re-chat-alert-title",
        "Call or text us right now:"
      );
      var text = el(
        "p",
        "re-chat-alert-text",
        "For an active electrical emergency, don't wait on chat — call or text us directly. If anyone is in immediate danger, call 911 first."
      );

      var callsWrap = el("div", "re-chat-alert-calls");

      var call1 = document.createElement("a");
      call1.className = "re-chat-alert-call";
      call1.href = "tel:" + PRIMARY_PHONE_TEL;
      call1.textContent = "Call/Text " + PRIMARY_PHONE_DISPLAY;

      var call2 = document.createElement("a");
      call2.className = "re-chat-alert-call";
      call2.href = "tel:" + SECONDARY_PHONE_TEL;
      call2.textContent = "Call/Text " + SECONDARY_PHONE_DISPLAY;

      callsWrap.appendChild(call1);
      callsWrap.appendChild(call2);

      alertBox.appendChild(title);
      alertBox.appendChild(text);
      alertBox.appendChild(callsWrap);

      messagesEl.appendChild(alertBox);
      scrollMessagesToBottom();
    }

    function renderLeadPrompt(topicKey) {
      addBotMessage(
        "Want someone to follow up? Leave your info and we'll reach out."
      );
      renderLeadForm(topicKey);
    }

    function renderLeadForm(topicKey) {
      var topicLabel = TOPICS[topicKey].label;

      var wrap = el("form", "re-chat-lead");
      wrap.setAttribute("novalidate", "novalidate");
      // action is set for progressive-enhancement / no-JS fallback;
      // the submit handler below intercepts normal submits.
      wrap.action =
        LEAD_FORM_ENDPOINT === PLACEHOLDER_ENDPOINT ? "#" : LEAD_FORM_ENDPOINT;
      wrap.method = "POST";

      var intro = el(
        "p",
        "re-chat-lead-intro",
        "Topic: " + topicLabel
      );
      wrap.appendChild(intro);

      var nameField = buildField(
        "text",
        "re-chat-name-" + topicKey,
        "name",
        "Name",
        "Your name",
        true
      );
      var phoneField = buildField(
        "tel",
        "re-chat-phone-" + topicKey,
        "phone",
        "Phone",
        "Best number to reach you",
        true
      );

      var messageWrap = el("div", "re-chat-field");
      var messageLabel = el(
        "label",
        null,
        "What's going on?"
      );
      var messageId = "re-chat-message-" + topicKey;
      messageLabel.setAttribute("for", messageId);
      var messageInput = document.createElement("textarea");
      messageInput.id = messageId;
      messageInput.name = "message";
      messageInput.rows = 2;
      messageInput.placeholder = "A sentence or two is plenty";
      messageWrap.appendChild(messageLabel);
      messageWrap.appendChild(messageInput);

      var topicHidden = document.createElement("input");
      topicHidden.type = "hidden";
      topicHidden.name = "topic";
      topicHidden.value = topicLabel;

      var submitBtn = el("button", "re-chat-lead-submit", "Send");
      submitBtn.type = "submit";

      var note = el(
        "p",
        "re-chat-lead-note",
        "We'll only use this to follow up about your project."
      );

      wrap.appendChild(nameField.wrap);
      wrap.appendChild(phoneField.wrap);
      wrap.appendChild(messageWrap);
      wrap.appendChild(topicHidden);
      wrap.appendChild(submitBtn);
      wrap.appendChild(note);

      wrap.addEventListener("submit", function (evt) {
        handleLeadSubmit(evt, wrap, submitBtn, {
          nameInput: nameField.input,
          phoneInput: phoneField.input,
          messageInput: messageInput,
          topicLabel: topicLabel,
        });
      });

      messagesEl.appendChild(wrap);
      scrollMessagesToBottom();

      // Move focus to the first field so keyboard/screen-reader users
      // land right where they need to be.
      nameField.input.focus();
    }

    function buildField(type, id, name, labelText, placeholder, required) {
      var wrap = el("div", "re-chat-field");
      var label = el("label", null, labelText);
      label.setAttribute("for", id);

      var input = document.createElement("input");
      input.type = type;
      input.id = id;
      input.name = name;
      input.placeholder = placeholder;
      if (required) {
        input.required = true;
      }

      wrap.appendChild(label);
      wrap.appendChild(input);

      return { wrap: wrap, input: input };
    }

    /* ---------- Lead submission ---------- */

    function handleLeadSubmit(evt, formEl, submitBtn, fields) {
      evt.preventDefault();

      var name = fields.nameInput.value.trim();
      var phone = fields.phoneInput.value.trim();
      var message = fields.messageInput.value.trim();

      if (!name || !phone) {
        addBotMessage(
          "Looks like your name and phone number are needed so we can reach out — mind adding those?"
        );
        if (!name) {
          fields.nameInput.focus();
        } else {
          fields.phoneInput.focus();
        }
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending…";

      var payload = {
        name: name,
        phone: phone,
        message: message,
        topic: fields.topicLabel,
        source: "reidelectricservices.com website chat widget",
      };

      if (LEAD_FORM_ENDPOINT === PLACEHOLDER_ENDPOINT) {
        // ---- Fallback path: no real endpoint configured yet ----
        // Build a pre-filled mailto: link so the lead is never lost.
        sendViaMailtoFallback(payload, formEl, submitBtn);
        return;
      }

      // ---- Real path: POST to the configured endpoint ----
      fetch(LEAD_FORM_ENDPOINT, {
        method: "POST",
        headers: {
          Accept: "application/json",
          "Content-Type": "application/json",
        },
        body: JSON.stringify(payload),
      })
        .then(function (response) {
          if (response.ok) {
            showLeadSuccess(formEl, false);
          } else {
            showLeadError(formEl, submitBtn);
          }
        })
        .catch(function () {
          showLeadError(formEl, submitBtn);
        });
    }

    function sendViaMailtoFallback(payload, formEl, submitBtn) {
      var subject = encodeURIComponent(
        "Website Lead: " + payload.topic + " — " + payload.name
      );
      var bodyLines = [
        "New lead from the Reid Electric Services website chat widget:",
        "",
        "Name: " + payload.name,
        "Phone: " + payload.phone,
        "Topic: " + payload.topic,
        "What's going on: " + (payload.message || "(not provided)"),
      ];
      var body = encodeURIComponent(bodyLines.join("\n"));
      var mailtoUrl =
        "mailto:" + FALLBACK_EMAIL + "?subject=" + subject + "&body=" + body;

      // Open the user's mail client with the lead pre-filled.
      window.open(mailtoUrl, "_blank");

      showLeadSuccess(formEl, true);
    }

    function showLeadSuccess(formEl, viaMailto) {
      var successMsg = viaMailto
        ? "Your email app should have opened with your info filled in — just hit send there and we'll get it. You can also call/text " +
          PRIMARY_PHONE_DISPLAY +
          " anytime."
        : "Thanks — we've got your info and will reach out shortly. For anything urgent, call/text " +
          PRIMARY_PHONE_DISPLAY +
          ".";

      replaceFormWithNotice(formEl, successMsg);
    }

    function showLeadError(formEl, submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = "Send";

      var errorMsg =
        "Something went wrong sending that. Please call or text us directly at " +
        PRIMARY_PHONE_DISPLAY +
        " or " +
        SECONDARY_PHONE_DISPLAY +
        ", or try sending the form again.";

      addBotMessage(errorMsg);
    }

    function replaceFormWithNotice(formEl, text) {
      var notice = el("div", "re-chat-msg re-chat-msg--bot", text);
      formEl.parentNode.replaceChild(notice, formEl);

      var restartBtn = el(
        "button",
        "re-chat-restart",
        "Ask about something else"
      );
      restartBtn.type = "button";
      restartBtn.addEventListener("click", startConversation);
      messagesEl.appendChild(restartBtn);

      scrollMessagesToBottom();
    }

    /* ---------- Panel open/close + focus management ---------- */

    function getFocusableElements() {
      return Array.prototype.slice.call(
        panel.querySelectorAll(
          'a[href], button:not([disabled]), input, textarea, select, [tabindex]:not([tabindex="-1"])'
        )
      );
    }

    function openPanel() {
      lastFocusedEl = document.activeElement;

      panel.classList.add("re-chat-panel--open");
      panel.setAttribute("aria-hidden", "false");
      toggleBtn.setAttribute("aria-expanded", "true");
      toggleBtn.setAttribute("aria-label", "Close chat");

      if (messagesEl.children.length === 0) {
        startConversation();
      }

      var focusables = getFocusableElements();
      if (focusables.length > 0) {
        focusables[0].focus();
      } else {
        closeBtn.focus();
      }

      document.addEventListener("keydown", onPanelKeydown, true);
    }

    function closePanel() {
      panel.classList.remove("re-chat-panel--open");
      panel.setAttribute("aria-hidden", "true");
      toggleBtn.setAttribute("aria-expanded", "false");
      toggleBtn.setAttribute(
        "aria-label",
        "Open chat with Reid Electric Services"
      );

      document.removeEventListener("keydown", onPanelKeydown, true);

      if (lastFocusedEl && typeof lastFocusedEl.focus === "function") {
        lastFocusedEl.focus();
      } else {
        toggleBtn.focus();
      }
    }

    function onPanelKeydown(evt) {
      if (evt.key === "Escape" || evt.key === "Esc") {
        evt.preventDefault();
        closePanel();
        return;
      }

      if (evt.key === "Tab") {
        var focusables = getFocusableElements();
        if (focusables.length === 0) return;

        var first = focusables[0];
        var last = focusables[focusables.length - 1];

        if (evt.shiftKey && document.activeElement === first) {
          evt.preventDefault();
          last.focus();
        } else if (!evt.shiftKey && document.activeElement === last) {
          evt.preventDefault();
          first.focus();
        }
      }
    }

    toggleBtn.addEventListener("click", function () {
      var isOpen = panel.classList.contains("re-chat-panel--open");
      if (isOpen) {
        closePanel();
      } else {
        openPanel();
      }
    });

    closeBtn.addEventListener("click", closePanel);
  })();
</script>
