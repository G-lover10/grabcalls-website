<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#d62828" />
<title>E12 Truck Swap · Station 12</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Station 12" />
<style>
  :root {
    --bg: #f2f4f7;
    --panel: #ffffff;
    --panel-2: #f2f4f7;
    --line: #dde1e7;
    --text: #1a1c1e;
    --muted: #6b7280;
    --red: #d62828;
    --red-soft: #8b1c1c;
    --gold: #b45309;
    --green: #166534;
    --blue: #1d4ed8;
    --orange: #c2410c;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(env(safe-area-inset-bottom) + 80px);
  }

  /* ── Header ── */
  .app-header {
    background: linear-gradient(180deg, rgba(198,40,40,0.96) 0%, rgba(155,28,28,0.96) 100%);
    padding: 14px 16px 12px;
    padding-top: calc(env(safe-area-inset-top) + 14px);
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow);
  }
  .header-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .back-btn {
    background: rgba(0,0,0,0.25);
    border: none; border-radius: 8px;
    color: white; font-size: 18px;
    padding: 6px 10px; cursor: pointer;
    font-family: inherit; font-weight: 700;
    flex-shrink: 0;
    text-decoration: none;
    display: inline-flex; align-items: center;
  }
  .header-title {
    flex: 1;
    font-size: 18px; font-weight: 800;
    color: white; line-height: 1.2;
  }
  .header-sub { font-size: 12px; font-weight: 500; opacity: 0.8; }
  .reset-btn {
    background: rgba(0,0,0,0.25);
    border: none; border-radius: 8px;
    color: rgba(255,255,255,0.75); font-size: 12px;
    padding: 6px 10px; cursor: pointer;
    font-family: inherit; font-weight: 700;
    flex-shrink: 0;
  }
  .reset-btn:active { background: rgba(0,0,0,0.5); }
  .share-btn {
    background: rgba(255,255,255,0.15);
    border: none; border-radius: 8px;
    color: white; font-size: 13px;
    padding: 6px 12px; cursor: pointer;
    font-family: inherit; font-weight: 800;
    flex-shrink: 0;
  }
  .share-btn:active { background: rgba(255,255,255,0.3); }
  .done-btn-share { background: var(--blue); color: white; }

  /* ── Unit number row ── */
  .unit-row {
    display: flex; align-items: center;
    gap: 8px; margin-bottom: 8px;
  }
  .unit-label { font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.85); white-space: nowrap; }
  .unit-num-input {
    flex: 1; min-width: 0;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px;
    color: white; font-size: 14px; font-weight: 700;
    font-family: inherit; padding: 5px 8px;
  }
  .unit-num-input::placeholder { color: rgba(255,255,255,0.35); }
  .unit-num-input:focus { outline: none; border-color: rgba(255,255,255,0.6); }
  .unit-arrow-txt { color: rgba(255,255,255,0.5); font-size: 16px; font-weight: 700; }

  /* ── Crew fields ── */
  .crew-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .crew-field { flex: 1; min-width: 0; }
  .crew-label-sm {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px;
  }
  .crew-input {
    width: 100%; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font-size: 14px; font-family: inherit; padding: 8px 10px;
  }
  .crew-input:focus { outline: none; border-color: var(--red); }

  /* ── Custom items ── */
  .custom-section {
    margin: 12px 12px 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .custom-section-hdr {
    display: flex; align-items: center;
    padding: 11px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 13px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); gap: 6px;
  }
  .add-item-row {
    display: flex; gap: 8px; padding: 10px 12px;
    border-top: 1px solid var(--line);
  }
  .add-item-input {
    flex: 1; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font-size: 14px; font-family: inherit; padding: 8px 10px;
  }
  .add-item-input:focus { outline: none; border-color: var(--red); }
  .add-item-btn {
    background: var(--red); color: white; border: none;
    border-radius: 8px; font-size: 14px; font-weight: 800;
    font-family: inherit; padding: 8px 16px; cursor: pointer; white-space: nowrap;
  }
  .item-remove { flex-shrink: 0; padding: 0 12px 0 0; display: flex; align-items: center; }
  .remove-btn {
    background: none; border: 1px solid var(--line); border-radius: 6px;
    color: var(--muted); font-size: 13px; cursor: pointer; padding: 4px 8px; line-height: 1;
  }
  .remove-btn:active { background: rgba(214,40,40,0.1); border-color: var(--red); color: var(--red); }

  /* ── Re-Swap banner ── */
  .reswap-banner {
    display: none;
    background: #1e3a5f;
    color: #93c5fd;
    font-size: 13px; font-weight: 700;
    text-align: center;
    padding: 7px 16px;
    letter-spacing: 0.04em;
  }
  .reswap-banner.show { display: block; }
  .reswap-exit {
    background: none; border: none;
    color: #93c5fd; font-size: 12px; font-weight: 700;
    font-family: inherit; cursor: pointer;
    text-decoration: underline;
    margin-left: 10px;
  }

  /* Progress bar */
  .progress-wrap {
    background: rgba(0,0,0,0.3);
    border-radius: 99px;
    height: 8px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #f5c518, #2ea043);
    border-radius: 99px;
    transition: width 0.25s ease;
    min-width: 4px;
  }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 12px; color: rgba(255,255,255,0.8);
    margin-top: 4px; font-weight: 600;
  }

  /* ── Sections ── */
  .section {
    margin: 12px 12px 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .section-header {
    display: flex; align-items: center;
    padding: 11px 14px;
    border-bottom: 1px solid var(--line);
    gap: 8px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .section-header:active { background: var(--panel-2); }
  .section-icon { font-size: 18px; flex-shrink: 0; }
  .section-label {
    flex: 1;
    font-size: 14px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.06em;
    line-height: 1.2;
  }
  .section-count {
    font-size: 12px; font-weight: 700;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 99px;
    padding: 2px 8px;
    flex-shrink: 0;
  }
  .section-count.done { color: var(--green); border-color: rgba(46,160,67,0.4); }
  .section-chevron {
    font-size: 12px; color: var(--muted);
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .section.collapsed .section-chevron { transform: rotate(-90deg); }
  .section-body { display: block; }
  .section.collapsed .section-body { display: none; }

  /* Warn section (gold border) */
  .section.warn { border-color: rgba(180,83,9,0.4); }
  .section.warn .section-header { background: rgba(180,83,9,0.05); }
  .section.warn .section-label { color: var(--gold); }

  /* ── Checklist items ── */
  .item {
    display: flex;
    align-items: center;
    gap: 0;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.1s;
    min-height: 58px;
  }
  .item:last-child { border-bottom: none; }
  .item:active { background: var(--panel-2); }
  .item.checked { background: rgba(22,101,52,0.06); }
  .item.skipped { background: rgba(29,78,216,0.06); }

  .item-check {
    width: 58px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    self-align: stretch;
    min-height: 58px;
  }
  .check-box {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 2px solid var(--line);
    background: var(--panel-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .item.checked .check-box {
    background: #16a34a;
    border-color: #16a34a;
    color: white;
  }
  .item.skipped .check-box {
    background: #2563eb;
    border-color: #2563eb;
    color: white;
  }

  .item-text {
    flex: 1;
    padding: 12px 14px 12px 0;
    font-size: 15px;
    line-height: 1.35;
  }
  .item.checked .item-text {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: rgba(46,160,67,0.5);
  }
  .item.skipped .item-text { color: var(--muted); }

  .item-skip {
    flex-shrink: 0;
    padding: 0 12px 0 0;
    display: flex; align-items: center;
  }
  .skip-btn {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--muted);
    font-size: 11px; font-weight: 700;
    font-family: inherit;
    padding: 4px 7px;
    cursor: pointer;
    white-space: nowrap;
    line-height: 1.2;
  }
  .skip-btn:active { background: rgba(37,99,235,0.1); border-color: #2563eb; color: #1d4ed8; }
  .item.skipped .skip-btn { background: rgba(37,99,235,0.1); border-color: #2563eb; color: #1d4ed8; }

  /* Warn items */
  .section.warn .item-text { font-weight: 600; }

  /* ── Notes ── */
  .notes-section {
    margin: 12px 12px 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
  }
  .notes-label {
    font-size: 12px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin-bottom: 8px;
  }
  .notes-input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    padding: 10px 12px;
    resize: none;
    min-height: 80px;
    line-height: 1.5;
  }
  .notes-input:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 2px rgba(214,40,40,0.15); }
  .notes-hint { font-size: 11px; color: var(--muted); margin-top: 5px; }

  /* ── Complete bar ── */
  .complete-bar {
    position: fixed;
    bottom: env(safe-area-inset-bottom);
    left: 0; right: 0;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 10px 16px;
    display: flex;
    gap: 10px;
    z-index: 50;
  }
  .complete-btn {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px; font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
  }
  .complete-btn.inactive { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
  .complete-btn.active { background: #16a34a; color: white; }
  .complete-btn.active:active { background: #15803d; }

  /* ── Done overlay ── */
  .done-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center;
    flex-direction: column;
    padding: 32px;
    text-align: center;
  }
  .done-overlay.show { display: flex; }
  .done-inner {
    background: white;
    border-radius: 20px;
    padding: 32px 24px;
    width: 100%; max-width: 340px;
    display: flex; flex-direction: column; align-items: center;
  }
  .done-emoji { font-size: 72px; margin-bottom: 16px; }
  .done-title { font-size: 28px; font-weight: 900; color: #166534; margin-bottom: 8px; }
  .done-sub { font-size: 15px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
  .done-time { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
  .done-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .done-btn {
    padding: 14px; border-radius: 10px; border: none;
    font-size: 15px; font-weight: 700; font-family: inherit;
    cursor: pointer;
  }
  .done-btn-primary { background: #16a34a; color: white; }
  .done-btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-row">
    <a href="index.html" class="back-btn">← E12</a>
    <div class="header-title">
      Truck Swap
      <div class="header-sub">Engine → Reserve</div>
    </div>
    <button class="share-btn" id="shareBtn">📤 Share</button>
    <button class="share-btn" id="shareAppBtn" style="background:rgba(255,255,255,0.18);">📲 Share App</button>
    <button class="share-btn" id="reswapBtn" style="background:rgba(37,99,235,0.25);">🔄 Res→Res</button>
    <button class="reset-btn" id="resetBtn">Reset</button>
  </div>
  <!-- Normal mode: Engine # → Reserve # -->
  <div class="unit-row" id="unitRowNormal">
    <span class="unit-label">Eng #</span>
    <input class="unit-num-input" id="unitFromInput" placeholder="E12" type="text" style="max-width:90px" />
    <span class="unit-arrow-txt">→</span>
    <span class="unit-label">Res #</span>
    <input class="unit-num-input" id="unitToInput" placeholder="402" type="text" style="max-width:90px" />
  </div>
  <!-- Re-swap mode: Res → Res -->
  <div class="unit-row" id="unitRowReswap" style="display:none">
    <span class="unit-label">Res #</span>
    <input class="unit-num-input" id="reswapFromInput" placeholder="From (e.g. 402)" type="text" style="max-width:120px" />
    <span class="unit-arrow-txt">→</span>
    <span class="unit-label">Res #</span>
    <input class="unit-num-input" id="reswapToInput" placeholder="To (e.g. 403)" type="text" style="max-width:120px" />
  </div>
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <div class="progress-label">
    <span id="progressLabel">0 of 0 items</span>
    <span id="progressPct">0%</span>
  </div>
</header>

<div class="reswap-banner" id="reswapBanner">
  🔄 RES→RES MODE — moving gear from one reserve to another
  <button class="reswap-exit" id="reswapExitBtn">Exit</button>
</div>

<div id="listContainer"></div>

<div class="notes-section">
  <div class="notes-label" style="margin-bottom:8px">Crew on Duty</div>
  <div class="crew-row">
    <div class="crew-field">
      <div class="crew-label-sm">Officer</div>
      <input class="crew-input" id="crewOfficer" placeholder="Name" type="text" />
    </div>
    <div class="crew-field">
      <div class="crew-label-sm">Driver</div>
      <input class="crew-input" id="crewDriver" placeholder="Name" type="text" />
    </div>
  </div>
</div>

<div class="notes-section" style="margin-top:8px">
  <div class="notes-label">Swap Notes</div>
  <textarea class="notes-input" id="swapNotes" placeholder="Anything the reserve already had, anything unusual, items left on E12..."></textarea>
  <div class="notes-hint">Saved automatically.</div>
</div>

<div class="custom-section">
  <div class="custom-section-hdr">➕ Custom Items</div>
  <div id="customItemsList"></div>
  <div class="add-item-row">
    <input class="add-item-input" id="addItemInput" placeholder="Add item not on the list..." type="text" />
    <button class="add-item-btn" id="addItemBtn">Add</button>
  </div>
</div>

<div class="complete-bar">
  <button class="complete-btn inactive" id="completeBtn">Swap Complete ✓</button>
</div>

<div class="done-overlay" id="doneOverlay">
  <div class="done-inner">
    <div class="done-emoji">🚒</div>
    <div class="done-title">Swap Complete</div>
    <div class="done-sub" id="doneSub">E12 equipment transferred to reserve.<br>Reserve is ready to roll.</div>
    <div class="done-time" id="doneTime"></div>
    <div class="done-actions">
      <button class="done-btn done-btn-share" id="doneShareBtn">📤 Share with Incoming Crew</button>
      <button class="done-btn" id="doneReswapBtn" style="background:#1d4ed8;color:white;">🔄 Re-Swap to New Reserve</button>
      <button class="done-btn done-btn-primary" id="doneBackBtn">Back to Station 12</button>
      <button class="done-btn done-btn-ghost" id="doneStayBtn">View Checklist</button>
    </div>
  </div>
</div>

<script>

    if (!raw) return { checked: [], skipped: [], notes: "", completedAt: null, fromEngine: "E12", reserveTo: "", officer: "", driver: "", customItems: [], startedAt: new Date().toISOString() };

  } catch(_) { return { checked: [], skipped: [], notes: "", completedAt: null, fromEngine: "E12", reserveTo: "", officer: "", driver: "", customItems: [], startedAt: new Date().toISOString() }; }
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(_) {}
}

let state = loadState();
if (!Array.isArray(state.checked)) state.checked = [];
if (!Array.isArray(state.skipped)) state.skipped = [];
if (typeof state.notes !== "string") state.notes = "";
if (!state.fromEngine) state.fromEngine = "E12";
if (!state.reserveTo) state.reserveTo = "";
if (!state.officer) state.officer = "";

// ── Render ────────────────────────────────────────────────────────
function itemKey(sectionId, idx) { return `${sectionId}-${idx}`; }

function buildUI() {
  const container = document.getElementById("listContainer");
  container.innerHTML = "";

  SECTIONS.forEach(sec => {
    const sectionDone = sec.items.every((_, i) => {
      const k = itemKey(sec.id, i);
      return state.checked.includes(k) || state.skipped.includes(k);
    });
    const sectionChecked = sec.items.filter((_, i) => state.checked.includes(itemKey(sec.id, i))).length;
    const sectionSkipped = sec.items.filter((_, i) => state.skipped.includes(itemKey(sec.id, i))).length;
    const sectionDoneCount = sectionChecked + sectionSkipped;

    const div = document.createElement("div");
    div.className = "section" + (sec.warn ? " warn" : "") + (sectionDone ? " collapsed" : "");
    div.dataset.id = sec.id;

    // Section header
    const hdr = document.createElement("div");
    hdr.className = "section-header";
    hdr.innerHTML = `
      <span class="section-icon">${sec.icon}</span>
      <span class="section-label">${sec.label}</span>
      <span class="section-count${sectionDone ? " done" : ""}">${sectionDoneCount}/${sec.items.length}</span>
      <span class="section-chevron">▼</span>
    `;
    hdr.addEventListener("click", () => div.classList.toggle("collapsed"));

    // Section body
    const body = document.createElement("div");
    body.className = "section-body";

    sec.items.forEach((text, idx) => {
      const k = itemKey(sec.id, idx);
      const isChecked = state.checked.includes(k);
      const isSkipped = state.skipped.includes(k);

      const row = document.createElement("div");
      row.className = "item" + (isChecked ? " checked" : isSkipped ? " skipped" : "");
      row.innerHTML = `
        <div class="item-check">
          <div class="check-box">${isChecked ? "✓" : isSkipped ? "↷" : ""}</div>
        </div>
        <div class="item-text">${text}</div>
        <div class="item-skip">
          <button class="skip-btn" data-key="${k}" type="button">${isSkipped ? "undo" : "had it"}</button>
        </div>
      `;

      // Tap main row → toggle checked
      row.querySelector(".item-check").addEventListener("click", () => toggleCheck(k));
      row.querySelector(".item-text").addEventListener("click", () => toggleCheck(k));

      // "had it" button → toggle skip
      row.querySelector(".skip-btn").addEventListener("click", e => {
        e.stopPropagation();
        toggleSkip(k);
      });

      body.appendChild(row);
    });

    div.appendChild(hdr);
    div.appendChild(body);
    container.appendChild(div);
  });
}

function toggleCheck(key) {
  const ci = state.checked.indexOf(key);
  const si = state.skipped.indexOf(key);
  if (si !== -1) state.skipped.splice(si, 1); // remove from skipped first
  if (ci === -1) {
    state.checked.push(key);
  } else {
    state.checked.splice(ci, 1);
  }
  saveState();
  buildUI();
  updateProgress();
}

function toggleSkip(key) {
  const ci = state.checked.indexOf(key);
  const si = state.skipped.indexOf(key);
  if (ci !== -1) state.checked.splice(ci, 1); // remove from checked first
  if (si === -1) {
    state.skipped.push(key);
  } else {
    state.skipped.splice(si, 1);
  }
  saveState();
  buildUI();
  updateProgress();
}

function updateProgress() {
  const customCount = (state.customItems || []).length;
  const total = TOTAL + customCount;
  const done = state.checked.length + state.skipped.length;
  const pct = total === 0 ? 0 : Math.round(done / total * 100);
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = `${done} of ${total} items`;
  document.getElementById("progressPct").textContent = pct + "%";

  const btn = document.getElementById("completeBtn");
  if (done >= total) {
    btn.classList.remove("inactive"); btn.classList.add("active");
    btn.textContent = "✓ Swap Complete — Tap to Confirm";
  } else {
    btn.classList.remove("active"); btn.classList.add("inactive");
    btn.textContent = `Swap Complete (${total - done} remaining)`;
  }
}

      else if (state.skipped.includes(k)) hadIt.push(text);
      else pending.push(text);
    });

  let msg = `🚒 E12 → Reserve Swap | Station 12\n${dateStr}\n\n`;

  msg += `↷ Reserve already had: ${hadIt.length} item${hadIt.length !== 1 ? "s" : ""}\n`;

    msg += `\n⚠️ STILL NEEDED (${pending.length}):\n`;
    msg += pending.map(i => `  • ${i}`).join("\n") + "\n";

    } else { msg += `\n✅ New reserve fully equipped.\n`; }
    if (reswapState.notes && reswapState.notes.trim()) msg += `\nNotes: ${reswapState.notes.trim()}\n`;
    msg += `\nhttps://g-lover10.github.io/grabcalls-website/station-12/swap.html`;
    return msg;
  }

  // Normal Engine → Reserve mode
  const fromEngineLabel = state.fromEngine || "Engine";
  const toLabel = state.reserveTo ? `Res Eng ${state.reserveTo}` : "Reserve";
  const moved = [], hadIt = [], pending = [];
  SECTIONS.forEach(sec => {
    sec.items.forEach((text, idx) => {
      const k = itemKey(sec.id, idx);
      if (state.checked.includes(k)) moved.push(text);
      else if (state.skipped.includes(k)) hadIt.push(text);
      else pending.push(text);
    });
  });
  (state.customItems || []).forEach(item => {
    const k = `custom-${item.id}`;
    if (state.checked.includes(k)) moved.push(item.text + " ✎");
    else if (state.skipped.includes(k)) hadIt.push(item.text + " ✎");
    else pending.push(item.text + " ✎");
  });
  let msg = `🚒 ${fromEngineLabel} → ${toLabel} | Station 12\n${dateStr}\n`;
  if (state.officer || state.driver) msg += `Officer: ${state.officer || "—"} | Driver: ${state.driver || "—"}\n`;
  msg += `\n✓ Moved from ${fromEngineLabel}: ${moved.length} items\n↷ Reserve had: ${hadIt.length} items\n`;
  if (pending.length > 0) {
    msg += `\n⚠️ STILL NEEDED (${pending.length}):\n` + pending.map(i => `  • ${i}`).join("\n") + "\n";
  } else { msg += `\n✅ Reserve fully equipped.\n`; }
  if (state.notes && state.notes.trim()) msg += `\nNotes: ${state.notes.trim()}\n`;
  msg += `\nhttps://g-lover10.github.io/grabcalls-website/station-12/swap.html`;
  return msg;
};

// ── Reset ────────────────────────────────────────────────────────
document.getElementById("resetBtn").addEventListener("click", () => {
  const label = reswapMode ? "Reset re-swap? This clears all re-swap progress." : "Reset the checklist? This clears all checked items and notes.";
  if (!confirm(label)) return;
  if (reswapMode) {
    reswapState = { checked: [], skipped: [], notes: "", fromRes: reswapState.fromRes, toRes: "", customItems: [], startedAt: new Date().toISOString() };
    saveReswapState();
    reswapToEl.value = "";
    notesEl.value = "";
  } else {
    state = { checked: [], skipped: [], notes: "", completedAt: null, reserveTo: state.reserveTo, officer: state.officer, driver: state.driver, customItems: [], startedAt: new Date().toISOString() };
    saveState();
    notesEl.value = "";
  }
  renderCustomItems();
  buildUI();
  updateProgress();
});

// ── Init ─────────────────────────────────────────────────────────
buildUI();
updateProgress();
</script>
</body>
